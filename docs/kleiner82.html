  <style>
    @keyframes neonGradient {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .bg-animated {
      background-size: 320% 320%;
      animation: neonGradient 22s ease-in-out infinite;
    }

    .scanline-overlay::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.35),
        rgba(0, 0, 0, 0.35) 1px,
        transparent 1px,
        transparent 3px
      );
      mix-blend-mode: soft-light;
      opacity: 0.45;
      z-index: 0;
    }

    .crt-frame {
      position: relative;
      overflow: hidden;
    }
    .crt-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0.28),
        rgba(0,0,0,0.28) 1px,
        transparent 1px,
        transparent 3px
      );
      mix-blend-mode: soft-light;
      opacity: 0.35;
      z-index: 2;
    }
    .crt-frame::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at center,
        rgba(0,255,243,0.08),
        transparent 60%
      );
      opacity: 0.7;
      z-index: 2;
    }
    .crt-frame > img {
      position: relative;
      z-index: 1;
      display: block;
    }

    @keyframes crtFlicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.96; }
    }
    .crt-flicker {
      animation: crtFlicker 4.5s ease-in-out infinite;
    }

    .neon-btn {
      background: linear-gradient(135deg, rgba(0,255,243,0.04), rgba(255,45,210,0.06));
      border: 1px solid rgba(0,255,243,0.12);
      box-shadow: 0 0 18px rgba(0,255,243,0.06);
    }
    .neon-btn:hover {
      box-shadow: 0 0 26px rgba(255,45,210,0.12);
      border-color: rgba(255,45,210,0.25);
    }

    /* Album card active state */
    .album-card { cursor: pointer; }
    .album-card.active {
      border-color: rgba(0,255,243,0.5) !important;
      box-shadow: 0 0 30px rgba(0,255,243,0.15) !important;
    }

    /* Track item states */
    .track-item.playing {
      background: rgba(0,255,243,0.08);
    }
    .track-item.highlight:hover {
      background: rgba(0,255,243,0.05);
    }
    .track-item.highlight .track-play-btn {
      display: inline-flex;
    }
    .track-play-btn {
      display: none;
    }

    @keyframes c64blink { 50% { opacity: 0; } }

    /* Now playing bar */
    .now-playing {
      transform: translateY(100%);
      transition: transform 0.3s ease;
    }
    .now-playing.visible {
      transform: translateY(0);
    }

    /* Progress bar */
    .progress-bar {
      cursor: pointer;
    }
    .progress-fill {
      background: linear-gradient(90deg, #00fff3, #ff2dd2);
      transition: width 0.1s linear;
    }
  </style>

    albums.forEach(function (album, i) {
      var card = document.createElement('div');
      card.className = 'album-card rounded-xl bg-black/60 border border-cyan-400/20 shadow-[0_12px_40px_rgba(0,0,0,0.7)] hover:border-pink-400/40 hover:shadow-[0_18px_60px_rgba(255,45,210,0.25)] transition overflow-hidden';
      card.setAttribute('data-index', i);
      card.innerHTML =
        '<div class="crt-frame w-full aspect-square crt-flicker">' +
          '<img src="' + album.art + '" alt="' + album.title + '" class="w-full h-full object-cover" loading="lazy" />' +
        '</div>' +
        '<div class="p-3 text-right">' +
          '<h3 class="[font-family:\'Press Start 2P\',monospace] text-[0.6rem] sm:text-xs text-cyan-100 leading-relaxed">' + album.title + '</h3>' +
          '<div class="mt-2 flex gap-1.5 justify-end flex-wrap">' +
            '<span class="text-[0.6rem] px-1.5 py-0.5 rounded-full bg-black/30 border border-pink-400/10 text-pink-200">' + album.year + '</span>' +
            '<span class="text-[0.6rem] px-1.5 py-0.5 rounded-full bg-black/30 border border-cyan-400/10 text-cyan-200">' + album.tracks.length + ' tracks</span>' +
          '</div>' +
        '</div>';
      card.addEventListener('click', function () { openAlbum(i); });
      grid.appendChild(card);
    });

    // ── Open album ──
    function openAlbum(index) {
      currentAlbumIndex = index;
      var album = albums[index];

      // Highlight active card
      var cards = grid.querySelectorAll('.album-card');
      cards.forEach(function (c, i) {
        c.classList.toggle('active', i === index);
      });

      // Fill expanded section
      document.getElementById('expanded-art').src = album.art;
      document.getElementById('expanded-art').alt = album.title;
      document.getElementById('expanded-title').textContent = album.title;
      document.getElementById('expanded-desc').textContent = album.desc;
      document.getElementById('expanded-year').textContent = album.year;
      document.getElementById('expanded-tracks-count').textContent = album.tracks.length + ' tracks';
      document.getElementById('expanded-bandcamp').href = album.bandcamp;

      // Build track list
      trackListEl.innerHTML = '';
      album.tracks.forEach(function (track, ti) {
        var li = document.createElement('li');
        var classes = 'track-item flex items-center gap-2 px-3 py-2.5 rounded-lg transition';
        if (track.highlight) classes += ' highlight cursor-pointer';
        if (currentAlbumIndex === index && currentTrackIndex === ti && isPlaying) classes += ' playing';
        li.className = classes;
        li.setAttribute('data-track', ti);

        // Number + name + play icon all together
        var numAndName = '<span class="flex items-center gap-2 flex-1 min-w-0">' +
          '<span class="text-xs font-mono text-cyan-400/40 flex-shrink-0 w-6">' + (ti + 1) + '.</span>' +
          '<span class="text-sm ' + (track.highlight ? 'text-sky-100' : 'text-sky-100/60') + ' truncate">' + track.name + '</span>';

        if (track.highlight) {
          numAndName += '<button class="track-play-btn inline-flex items-center justify-center flex-shrink-0 text-cyan-300 hover:text-pink-300 transition ml-1" data-track="' + ti + '">' +
            '<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>' +
          '</button>' +
          '<span class="text-[0.55rem] px-1.5 py-0.5 rounded bg-pink-500/15 border border-pink-400/20 text-pink-200 flex-shrink-0 ml-1">\u2605</span>';
        }
        numAndName += '</span>';

        var durSpan = '<span class="text-xs font-mono text-cyan-400/40 flex-shrink-0 ml-3">' + track.duration + '</span>';

        li.innerHTML = numAndName + durSpan;
        trackListEl.appendChild(li);
      });

      // Bind play buttons and clickable highlight rows
      trackListEl.querySelectorAll('.track-play-btn').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          var ti = parseInt(btn.getAttribute('data-track'));
          playTrack(index, ti);
        });
      });
      trackListEl.querySelectorAll('.track-item.highlight').forEach(function (row) {
        row.addEventListener('click', function () {
          var ti = parseInt(row.getAttribute('data-track'));
          playTrack(index, ti);
        });
      });

      // Show expanded
      expanded.classList.remove('hidden');

      // Scroll to expanded
      expanded.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // ── Play track ──
    function playTrack(albumIndex, trackIndex) {
      var album = albums[albumIndex];
      var track = album.tracks[trackIndex];
      if (!track.highlight || !track.file) return;

      currentAlbumIndex = albumIndex;
      currentTrackIndex = trackIndex;

      audio.src = track.file;
      audio.play().catch(function () {});
      isPlaying = true;

      updateNowPlaying();
      updateTrackHighlight();
    }

    // ── Update now playing bar ──
    function updateNowPlaying() {
      var album = albums[currentAlbumIndex];
      var track = album.tracks[currentTrackIndex];

      document.getElementById('np-art').src = album.art;
      document.getElementById('np-art').classList.remove('hidden');
      document.getElementById('np-title').textContent = track.name;
      document.getElementById('np-album').textContent = album.title;

      nowPlaying.classList.add('visible');
      updatePlayPauseIcon();
    }

    function updatePlayPauseIcon() {
      document.getElementById('np-play-icon').classList.toggle('hidden', isPlaying);
      document.getElementById('np-pause-icon').classList.toggle('hidden', !isPlaying);
    }

    function updateTrackHighlight() {
      trackListEl.querySelectorAll('.track-item').forEach(function (li) {
        var ti = parseInt(li.getAttribute('data-track'));
        li.classList.toggle('playing', ti === currentTrackIndex && isPlaying);
      });
    }

    // ── Audio events ──
    audio.addEventListener('timeupdate', function () {
      if (!audio.duration) return;
      var pct = (audio.currentTime / audio.duration) * 100;
      document.getElementById('np-progress-fill').style.width = pct + '%';
      document.getElementById('np-time-current').textContent = formatTime(audio.currentTime);
      document.getElementById('np-time-total').textContent = formatTime(audio.duration);
    });

    audio.addEventListener('ended', function () {
      playNextHighlight();
    });

    audio.addEventListener('play', function () {
      isPlaying = true;
      updatePlayPauseIcon();
      updateTrackHighlight();
    });

    audio.addEventListener('pause', function () {
      isPlaying = false;
      updatePlayPauseIcon();
      updateTrackHighlight();
    });

    // ── Controls ──
    document.getElementById('np-play').addEventListener('click', function () {
      if (currentTrackIndex === -1) return;
      if (isPlaying) { audio.pause(); } else { audio.play().catch(function () {}); }
    });

    document.getElementById('np-prev').addEventListener('click', function () {
      playPrevHighlight();
    });

    document.getElementById('np-next').addEventListener('click', function () {
      playNextHighlight();
    });

    // Progress bar seek
    document.getElementById('np-progress').addEventListener('click', function (e) {
      if (!audio.duration) return;
      var rect = this.getBoundingClientRect();
      var pct = (e.clientX - rect.left) / rect.width;
      audio.currentTime = pct * audio.duration;
    });

    // ── Navigate highlights ──
    function getHighlightIndices(albumIndex) {
      var indices = [];
      albums[albumIndex].tracks.forEach(function (t, i) {
        if (t.highlight) indices.push(i);
      });
      return indices;
    }

    function playNextHighlight() {
      var highlights = getHighlightIndices(currentAlbumIndex);
      var pos = highlights.indexOf(currentTrackIndex);
      if (pos < highlights.length - 1) {
        playTrack(currentAlbumIndex, highlights[pos + 1]);
      } else {
        // Move to next album's first highlight
        for (var a = currentAlbumIndex + 1; a < albums.length; a++) {
          var h = getHighlightIndices(a);
          if (h.length > 0) { openAlbum(a); playTrack(a, h[0]); return; }
        }
        audio.pause();
        isPlaying = false;
        updatePlayPauseIcon();
      }
    }

    function playPrevHighlight() {
      var highlights = getHighlightIndices(currentAlbumIndex);
      var pos = highlights.indexOf(currentTrackIndex);
      if (pos > 0) {
        playTrack(currentAlbumIndex, highlights[pos - 1]);
      } else {
        // Move to prev album's last highlight
        for (var a = currentAlbumIndex - 1; a >= 0; a--) {
          var h = getHighlightIndices(a);
          if (h.length > 0) { openAlbum(a); playTrack(a, h[h.length - 1]); return; }
        }
      }
    }

    function formatTime(s) {
      var m = Math.floor(s / 60);
      var sec = Math.floor(s % 60);
      return m + ':' + (sec < 10 ? '0' : '') + sec;
    }

    // ── Auto-open first album ──
    openAlbum(0);
  })();
  </script>

  <!-- C64 Boot Animation -->
  <script>
  document.addEventListener('DOMContentLoaded', function () {
    var overlay = document.getElementById('c64-boot');

    var introLines = [
      'LOAD "$",8',
      '',
      'SEARCHING FOR $',
      'LOADING',
      'READY.',
      'LIST',
      '',
      '0 "KLEINER 82 MUSIC" DR.J AV',
      '',
    ];

    var dirEntries = [
      '  14  "C64 AMIGA REMIXES"  PRG',
      '  12  "ARCADIA DREAMS"     PRG',
      '  13  "ELECTRO CHROMO"     PRG',
      '  12  "LOST IN SPACE"      PRG',
      '   7  "MIAMI GATEWAY"      PRG',
    ];

    var outroLines = [
      '',
      '578 BLOCKS FREE.',
      '',
      'READY.',
    ];

    var content = '';

    function showCursorAndFade() {
      overlay.innerHTML = content + '<span style="display:inline-block;width:0.6em;height:1.1em;background:#fff;vertical-align:text-bottom;animation:c64blink 0.8s step-start infinite;"></span>';
      setTimeout(function () {
        overlay.style.transition = 'opacity 0.5s';
        overlay.style.opacity = '0';
        overlay.addEventListener('transitionend', function () {
          overlay.remove();
        }, { once: true });
      }, 600);
    }

    function typeLines(lines, index, done) {
      if (index >= lines.length) { done(); return; }
      var line = lines[index];
      if (line === '') {
        content += '\n';
        overlay.textContent = content;
        setTimeout(function () { typeLines(lines, index + 1, done); }, 80);
        return;
      }
      var charIndex = 0;
      function typeChar() {
        if (charIndex < line.length) {
          content += line[charIndex++];
          overlay.textContent = content;
          setTimeout(typeChar, 15 + Math.random() * 15);
        } else {
          content += '\n';
          overlay.textContent = content;
          setTimeout(function () { typeLines(lines, index + 1, done); }, 120);
        }
      }
      typeChar();
    }

    function snapEntries(index, done) {
      if (index >= dirEntries.length) { done(); return; }
      content += dirEntries[index] + '\n';
      overlay.textContent = content;
      setTimeout(function () { snapEntries(index + 1, done); }, 60);
    }

    typeLines(introLines, 0, function () {
      snapEntries(0, function () {
        typeLines(outroLines, 0, showCursorAndFade);
      });
    });
  });
  </script>
